name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate capabilities.json and generated views
        run: python tools/build_matrix.py --check
      - name: Probe script syntax
        run: python -m py_compile probes/lane_sweep.py
