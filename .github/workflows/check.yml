name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check 'jsonschema>=4.18,<5' numpy
      - name: Validate capabilities.json and generated views
        run: python tools/build_matrix.py --check
      - name: Validator regression tests
        run: python -m unittest discover -s tests -v
      - name: Probe script syntax
        run: python -m py_compile probes/_common.py probes/lane_sweep.py probes/integer_lanes.py probes/geometry_sweep.py tools/phase0a_capture_spike.py tools/phase0b_baseline.py
